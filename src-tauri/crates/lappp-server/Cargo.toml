[package]
# `lappp-server`: the standalone server build of lappp (phase 3). Skeleton ships with
# batch 3.2: flags, lock file, boot chain, server_info (command bridge and
# SSE land in the following 3.2 commits).
name = "lappp-server"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "lappp-server"
path = "src/main.rs"

[dependencies]
lappp-core = { path = "../lappp-core" }
axum = "0.8"
futures = "0.3.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
# Auth (batch 3.3): Argon2id password hashing; token MAC via blake3 keyed
# mode; device-token hashing via sha2; token encoding via base64url.
argon2 = "0.5"
base64 = "0.22.1"
blake3 = "1.8.3"
# Pair-companion preview validity check (same version the shell pins).
image = "0.25.10"
rand = "0.8"
rusqlite = { version = "0.32.1", features = ["bundled", "collation"] }
sha2 = "0.10"

[dev-dependencies]
# `start_paused` time control for the SSE coalescing tests.
tokio = { version = "1.50.0", features = ["full", "test-util"] }
