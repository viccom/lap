[package]
# `lapd`: the standalone server build of Lap (phase 3). Skeleton ships with
# batch 3.2: flags, lock file, boot chain, server_info (command bridge and
# SSE land in the following 3.2 commits).
name = "lap-server"
version = "0.3.3"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "lapd"
path = "src/main.rs"

[dependencies]
lap-core = { path = "../lap-core" }
axum = "0.8"
futures = "0.3.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }

[dev-dependencies]
# `start_paused` time control for the SSE coalescing tests.
tokio = { version = "1.50.0", features = ["full", "test-util"] }
