[package]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/manifest.html
name = "lappp"
version = "0.3.3"
description = "An offline-first photo manager for large local libraries."
homepage = "https://julyx10.github.io/lap"
repository = "https://github.com/julyx10/lap"
authors = ["julyx10 <tiangle@gmail.com>"]
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

# The workspace root stays at src-tauri (not the repo root) so Cargo.lock,
# target/ and the CI cache/artifact paths keep working unchanged. The lappp
# package above remains the root package the Tauri CLI builds.
[workspace]
members = ["crates/lappp-core", "crates/lappp-server"]
resolver = "3"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3

[dependencies]
# The embedded backend. Optional so the thin client (`--features client`) can
# be built WITHOUT it: not linking lappp-core means its build.rs (libraw /
# libjpeg-turbo / libheif / libde265) and the whole AI stack never compile or
# link, which is what makes the thin client small.
lappp-core = { path = "crates/lappp-core", optional = true }
drag = { path = "vendor/drag" }
tauri = { version = "2", features = [
    "macos-private-api",
    "protocol-asset",
] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-os = "2.3.2"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.0"
tauri-plugin-aptabase = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37.5"
plist = "1.8.0"
memmap2 = "0.9"
rusqlite = { version = "0.32.1", features = ["bundled", "collation"] }
chrono = "0.4"
rstar = "0.12"
csv = "1"
dirs = "5.0.1"
walkdir = "2.5.0"
trash = "3.3.1"
base64 = "0.22.1"
flate2 = "1"
http = "1"
image = "0.25.10"
png = "0.18.1"
kamadak-exif = "0.6.1"
little_exif = "0.6.23"
exiftool-rs = { version = "=1.0.0", default-features = false }
fast_image_resize = "5.1.0"
imagesize = "0.13.0"
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "blocking"] }
opener = "0.7.2"
arboard = "3.6.1"
pinyin = "0.10.0"
once_cell = "1.21.4"
rand = "0.8"
ort = { version = "=2.0.0-rc.10", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "copy-dylibs",
] }
ndarray = "0.16"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
uuid = { version = "1", features = ["v4"] }
blake3 = "1.8.3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
jxl-oxide = { version = "0.12.5", features = ["image"] }
libc = "0.2"
hnsw_rs = "0.3.4"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
xattr = "1.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
percent-encoding = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSScreen", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDictionary", "NSError", "NSLocale", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4.1"
windows = { version = "0.61.3", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
default = ["custom-protocol", "embedded"]
custom-protocol = ["tauri/custom-protocol"]
# Full desktop app: links the whole backend (`lappp-core`) and registers every
# local Tauri command. This is the default and unchanged behaviour.
embedded = ["dep:lappp-core"]
# Thin client: no local backend. The window navigates to a remote `lapd`
# server's Web UI; no library is opened and no local commands are registered.
# Build with `--no-default-features --features client`. It keeps
# `custom-protocol` so the bundled picker page is served from
# `tauri://localhost`.
client = ["custom-protocol"]
devtools = ["tauri/devtools"]
# Windows console subsystem opt-in: the default build (debug included) uses
# the GUI subsystem so double-clicking the exe does not flash a console
# window. Enable with `--features console` when stdout logs / panic output
# need to be visible during development. NOT part of default (release must
# stay GUI-subsystem).
console = []
